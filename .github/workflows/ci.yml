name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        command:
          - name: format-and-lint
            run: pnpm check
          - name: typecheck
            run: pnpm build && pnpm typecheck
          - name: gen
            run: pnpm build && pnpm -r gen
          - name: knip
            run: pnpm knip
          - name: depcruise
            run: pnpm depcruise
      fail-fast: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: ${{ matrix.command.name }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "lts/*"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: ${{ matrix.command.name }}
        run: ${{ matrix.command.run }}
      - name: Check for uncommitted changes
        run: git diff --exit-code

  test:
    strategy:
      matrix:
        include:
          # ubuntu-latest: LTS active + maintenance
          - os: ubuntu-latest
            node-version: "lts/*"
          - os: ubuntu-latest
            node-version: "lts/-1"
          # windows-latest: LTS active only
          - os: windows-latest
            node-version: "lts/*"
      fail-fast: false
    runs-on: ${{ matrix.os }}
    name: test / Node.js ${{ matrix.node-version }} / ${{ matrix.os }}
    permissions:
      contents: read
      pull-requests: write
      actions: write
    env:
      COVERAGE: ${{ matrix.node-version == 'lts/*' && matrix.os == 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: test
        run: |
          pnpm build
          pnpm test --coverage=${COVERAGE}
      - uses: k1LoW/octocov-action@v1.5.2
        if: matrix.node-version == 'lts/*' && matrix.os == 'ubuntu-latest'

  # The catalog pins one graphql version for the whole workspace, so this job
  # swaps it for the lowest version in @gqlkit-ts/cli's peer range.
  test-graphql-lowest:
    runs-on: ubuntu-latest
    name: test / graphql 16.9.0
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "lts/*"
          cache: pnpm
      - name: Pin graphql to 16.9.0
        run: |
          sed -i 's/^  graphql: .*/  graphql: "16.9.0"/' pnpm-workspace.yaml
          pnpm install --no-frozen-lockfile
          test "$(node -p 'require("graphql/package.json").version')" = "16.9.0"
      - name: test
        run: |
          pnpm build
          pnpm test

  status-check:
    runs-on: ubuntu-latest
    needs:
      - build
      - test
      - test-graphql-lowest
    permissions: {}
    if: failure()
    steps:
      - run: exit 1

